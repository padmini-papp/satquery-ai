<span class="material-symbols-outlined">add</span>
</button>
<button class="bg-surface-container-highest/90 backdrop-blur-lg border border-outline-variant/50 p-2 rounded-b-lg text-on-surface-variant hover:text-primary hover:bg-surface-bright transition-all">
