<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SatQuery AI - Brand Identity</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;700&amp;family=Geist+Mono&amp;display=swap" rel="stylesheet">
<style>
        :root {
            --surface: #0c1324;
            --primary: #22d3ee;
            --on-surface: #f8fafc;
        }
        body {
            background-color: var(--surface);
            color: var(--on-surface);
            font-family: 'Geist', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to right, rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, transparent 70%);
            filter: blur(40px);
            z-index: 0;
        }
        .logo-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-col: column;
            align-items: center;
            gap: 2rem;
        }
        .technical-frame {
            border: 1px solid rgba(34, 211, 238, 0.2);
            padding: 3rem;
            border-radius: 0.5rem;
            background: rgba(12, 19, 36, 0.6);
            backdrop-filter: blur(12px);
            position: relative;
        }
        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--primary);
        }
        .top-left { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
        .top-right { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
        .bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
        .bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
        
        .logo-img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.3));
        }
        .brand-name {
            font-family: 'Geist', sans-serif;
            font-weight: 700;
            font-size: 3rem;
            letter-spacing: -0.05em;
            color: var(--primary);
            margin-top: 1.5rem;
            text-transform: uppercase;
        }
        .technical-label {
            font-family: 'Geist Mono', monospace;
            font-size: 0.75rem;
            color: rgba(34, 211, 238, 0.6);
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="glow"></div>
<div class="logo-container" style="width: 100%; height: 100%; gap: 0px;">
<div class="technical-frame" style="width: 100vw; height: 100vh; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; backdrop-filter: none;">
<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>
<div class="technical-label">IDENTITY PROTOCOL // SQ-A1</div>
<img alt="SatQuery AI Classy Logo" class="logo-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQLxJChJsfi3_lTZVqgSxUL5zvOKtaZ7g_iUeIRpG8iux9Sg5MDR6IpZdPsE2rQFILSNDr6ZTs1VdYFs8Vyu-DKZf4u4vcgreRvG9VccJACVJt3m8w_H7oDw0MV8iSdJSzXsAosIS8AWA_DGlQ1KD5HoVIoDy4gWD4vw4S51CCE_hPbIedyJuKuNVV1V6Lh-7Koa5l1wGFJEmMMTA6088yj7ZaRDXZXOs2CcW8CbAjfTaZXZb5SZQw" style="width: 288px; height: 288px;">
<div class="brand-name" style="font-size: 3.6rem;">SatQuery AI</div>
<div class="mt-4 font-mono text-xs text-primary/40 uppercase tracking-widest">Orbital Intelligence Systems</div>
</div>
</div>



</body></html>
